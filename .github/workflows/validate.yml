name: Validate

on:
  workflow_dispatch:
  
  push:
    branches:
      - '*'

  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint-pods:
    name: Lint Cocoapods
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup build enviroment
        uses: ./.github/actions/setup-build-env

      - name: Lint Pod
        run: |
          # Lint iOS only: the podspec also declares tvOS/macOS, but the runner has no
          # matching tvOS simulator destination, which fails the lint. iOS is the platform
          # CocoaPods consumers actually use for this XCTest agent.
          pod lib lint --allow-warnings --platforms=ios

  build:
    name: Build default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          # A build needs no concrete device; the generic destination survives runner-image changes.
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "generic/platform=$platform"

  unit-tests:
    name: Unit tests (ExampleUnitTests)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ExampleUnitTests
        run: |
          # Ask xcodebuild for an iPhone simulator it can actually run and pin it by id: a
          # name alone resolves against the newest runtime only, where that model may not exist.
          device_id=$(xcodebuild -showdestinations -scheme Example -project ReportPortalAgent.xcodeproj 2>&1 \
            | grep -m1 'platform:iOS Simulator.*name:iPhone' | grep -oE 'id:[^,]+' | cut -d: -f2)
          echo "Using simulator: $device_id"
          # Run only the network-free unit target: ExampleUnitTests sets
          # PushTestDataToReportPortal=NO, so it makes no live ReportPortal calls and is
          # deterministic in CI. It covers the agent's own resolution logic
          # (parseBoolFlag, resolveMergeGroup/SkipFinish, the 409 finalize predicate,
          # OperationTracker). ExampleUITests are intentionally excluded — they need
          # parallel simulators / SauceLabs and are validated separately.
          xcodebuild test \
            -scheme Example \
            -project ReportPortalAgent.xcodeproj \
            -destination "platform=iOS Simulator,id=$device_id" \
            -only-testing:ExampleUnitTests
